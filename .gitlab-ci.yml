# composer ci is the contract: the checks are defined there, and this pipeline wraps them.
# It also carries rollcall-scan, a read-only scan of the 13 stack projects on a schedule or by hand.
# Rollcall's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.3.1. Never use ~latest.
# Rollcall requires PHP ^8.3, so the test matrix starts at 8.3.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.3.1
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.3.1
    inputs:
      image: "composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: deploy/ is a subfolder, so PROCTOR always warns that it has no .gitlab-ci.yml (the pipeline is
  # here at the root). On 2026-11-06 it also failed composer audit on Symfony 7.4.22 in deploy/composer.lock,
  # fixed by the move to 7.4.23.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.3.1
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      allow_failure: true
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
  # Accessibility: axe-core in Playwright (Preflight's a11y component), WCAG 2.2 AA.
  # The front page and its docs, served from site/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.3.1
    inputs:
      job_name: a11y-site
      site_dir: site
      pages: ["index.html", "docs/**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]
  # The dashboard pages, rendered by the dashboard-render job below.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.3.1
    inputs:
      job_name: dashboard-a11y
      site_dir: build/dashboard-a11y
      pages: ["index.html", "apps.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash (D-072): Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# dashboard-render: renders the public and internal dashboard pages with PHPUnit
# (DashboardRenderTest) and hands them to dashboard-a11y as an artifact.
dashboard-render:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - ROLLCALL_DASHBOARD_OUT="$CI_PROJECT_DIR/build/dashboard-a11y" vendor/bin/phpunit --filter DashboardRender
    - test -s build/dashboard-a11y/index.html && test -s build/dashboard-a11y/apps.html
  artifacts:
    paths:
      - build/dashboard-a11y/
    expire_in: 7 days

dashboard-a11y:
  needs: [dashboard-render]

# rollcall-scan: scans the 13 stack projects read-only and keeps the snapshot JSON in
# var/snapshots/ as a 30 day artifact. The schedule is a GitLab setting (CI/CD > Schedules,
# weekly, with the variable ROLLCALL_JOB=scan), or run by hand from the web. Without
# ROLLCALL_GITLAB_TOKEN it skips green.
rollcall-scan:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $ROLLCALL_JOB == "scan"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script: |
    set -eu
    if [ -z "${ROLLCALL_GITLAB_TOKEN:-}" ]; then echo "ROLLCALL_GITLAB_TOKEN not set; skipping the Rollcall scan"; exit 0; fi
    composer install --no-dev --no-interaction --no-progress --prefer-dist
    export ROLLCALL_SOURCE=gitlab
    export ROLLCALL_GITLAB_URL="${ROLLCALL_GITLAB_URL:-https://$CI_SERVER_FQDN}"
    export ROLLCALL_GITLAB_PROJECTS="${ROLLCALL_GITLAB_PROJECTS:-enterprise-apps/creed,enterprise-apps/proctor,enterprise-apps/preflight,enterprise-apps/sesame,enterprise-apps/helmet,enterprise-apps/sourdough,enterprise-apps/squire,enterprise-apps/rollcall,enterprise-apps/booster,enterprise-apps/advisor,enterprise-apps/drawbridge,enterprise-apps/pinstripe,enterprise-apps/weld}"
    php bin/rollcall scan
    # The register: a scanned app with no owner on file fails this job, so nobody is left without a teacher.
    ROLLCALL_OWNERS_FILE="${ROLLCALL_OWNERS_FILE:-owners.json}" php bin/rollcall owners
  artifacts:
    paths:
      - var/snapshots/
    expire_in: 30 days

# creed-copy-refresh: keeps the generated CREED copy in src/Creed current with no person
# in the loop. It clones CREED main with the job token, re-exports the copy, rebuilds what
# the copy feeds (versions table, docs site, agent-ready files), runs composer
# creed-copy:check and the full composer ci, and only when both pass pushes one commit to
# main with the job token. The schedule is a GitLab setting (CI/CD > Schedules: weekly,
# Monday 07:03 America/Detroit, one hour after CREED's policy robot, with the variable
# ROLLCALL_JOB=creed-copy); a person can also run it by hand from the web on main. It never
# runs on a branch. GitLab starts no pipeline for a job-token push, so this job runs the
# gate itself before it pushes. A red run pushes nothing and leaves main untouched; next
# week's run tries again. The steps live in tools/creed-copy-refresh.sh.
creed-copy-refresh:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $ROLLCALL_JOB == "creed-copy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sh tools/creed-copy-refresh.sh
