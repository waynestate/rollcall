# composer ci is the contract: the checks are defined there, and this pipeline wraps them.
# It also carries rollcall-scan, a read-only scan of the 13 stack projects on a schedule or by hand.
# Rollcall's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.8.0. Never use ~latest.
# Rollcall requires PHP ^8.3, so the test matrix starts at 8.3.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.8.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.8.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # It blocks (the component's default): a failing check fails the pipeline. Warnings never fail it.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.8.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      image: "php:8.5-cli-trixie@sha256:9236fd373d3bcda0659cf94838a744bd79791419292958963f8c6b34a0071554"
  # Accessibility: axe-core in Playwright (Preflight's a11y component), WCAG 2.2 AA.
  # The front page and its docs, served from site/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.8.0
    inputs:
      job_name: a11y-site
      site_dir: site
      pages: ["index.html", "docs/**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]
  # The dashboard pages, rendered by the dashboard-render job below: Laravel (index, apps, empty) and raw PHP (raw-*),
  # plus the Vue page (vue-*), server-rendered by dashboard-vue once it matches the PHP page.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.8.0
    inputs:
      job_name: dashboard-a11y
      site_dir: build/dashboard-a11y
      pages: ["index.html", "apps.html", "empty.html", "raw.html", "raw-apps.html", "raw-empty.html", "vue.html", "vue-apps.html", "vue-empty.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# dashboard-render: renders the public, internal and empty-state dashboard pages, from
# Laravel and from the raw-PHP entry point, with PHPUnit (DashboardRenderTest), plus the Inertia
# page objects the same routes answer with (inertia*.json), and hands them to dashboard-vue and
# dashboard-a11y as an artifact.
dashboard-render:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - ROLLCALL_WAYNEUI_CSS=/assets/wayne-ui/wayne-ui.css ROLLCALL_DASHBOARD_OUT="$CI_PROJECT_DIR/build/dashboard-a11y" vendor/bin/phpunit --filter DashboardRender
    - mkdir -p build/dashboard-a11y/assets && cp -r site/assets/wayne-ui build/dashboard-a11y/assets/
    - test -s build/dashboard-a11y/index.html && test -s build/dashboard-a11y/apps.html && test -s build/dashboard-a11y/empty.html
    - test -s build/dashboard-a11y/raw.html && test -s build/dashboard-a11y/raw-apps.html && test -s build/dashboard-a11y/raw-empty.html
    - test -s build/dashboard-a11y/inertia.json && test -s build/dashboard-a11y/inertia-apps.json && test -s build/dashboard-a11y/inertia-empty.json
  artifacts:
    paths:
      - build/dashboard-a11y/
    expire_in: 7 days

# dashboard-vue: the Vue page's parity check. Server-renders resources/js/RollcallDashboard.vue
# with the Inertia props dashboard-render saved (inertia*.json) and fails unless it matches the
# Blade page for the same report, element for element (tools/vue-dashboard/parity.mjs). On a
# match it writes vue.html, vue-apps.html and vue-empty.html for dashboard-a11y. It runs in the
# a11y component's own image (Node 26, pinned by digest), so the pipeline pulls no new image.
dashboard-vue:
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
  needs: [dashboard-render]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always
  script:
    - npm ci --prefix tools/vue-dashboard --ignore-scripts --no-audit --no-fund
    - node --disable-warning=ExperimentalWarning tools/vue-dashboard/parity.mjs build/dashboard-a11y
    - test -s build/dashboard-a11y/vue.html && test -s build/dashboard-a11y/vue-apps.html && test -s build/dashboard-a11y/vue-empty.html
  artifacts:
    paths:
      - build/dashboard-a11y/
    expire_in: 7 days

dashboard-a11y:
  needs: [dashboard-render, dashboard-vue]

# rollcall-scan: scans the 13 stack projects read-only and keeps the snapshot JSON in
# var/snapshots/ as a 30 day artifact. The schedule is a GitLab setting (CI/CD > Schedules,
# weekly, with the variable ROLLCALL_JOB=scan), or run by hand from the web. Without
# ROLLCALL_GITLAB_TOKEN it skips green.
rollcall-scan:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $ROLLCALL_JOB == "scan"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script: |
    set -eu
    if [ -z "${ROLLCALL_GITLAB_TOKEN:-}" ]; then echo "ROLLCALL_GITLAB_TOKEN not set; skipping the Rollcall scan"; exit 0; fi
    composer install --no-dev --no-interaction --no-progress --prefer-dist
    export ROLLCALL_SOURCE=gitlab
    export ROLLCALL_GITLAB_URL="${ROLLCALL_GITLAB_URL:-https://$CI_SERVER_FQDN}"
    export ROLLCALL_GITLAB_PROJECTS="${ROLLCALL_GITLAB_PROJECTS:-enterprise-apps/creed,enterprise-apps/proctor,enterprise-apps/preflight,enterprise-apps/sesame,enterprise-apps/helmet,enterprise-apps/sourdough,enterprise-apps/squire,enterprise-apps/rollcall,enterprise-apps/booster,enterprise-apps/advisor,enterprise-apps/drawbridge,enterprise-apps/pinstripe,enterprise-apps/weld}"
    php bin/rollcall scan
    # The register: a scanned app with no owner on file, or one nobody re-confirmed in ROLLCALL_OWNERS_CONFIRM_DAYS,
    # fails this job, so nobody is left without a teacher.
    ROLLCALL_OWNERS_FILE="${ROLLCALL_OWNERS_FILE:-owners.json}" php bin/rollcall owners
  artifacts:
    paths:
      - var/snapshots/
    expire_in: 30 days

# creed-copy-refresh: keeps the generated CREED copy in src/Creed current with no person
# in the loop. It clones CREED main with the job token, re-exports the copy, rebuilds what
# the copy feeds (versions table, docs site, agent-ready files), runs composer
# creed-copy:check and the full composer ci, and only when both pass pushes one commit to
# main with the job token. The schedule is a GitLab setting (CI/CD > Schedules: weekly,
# Monday 07:03 America/Detroit, one hour after CREED's policy robot, with the variable
# ROLLCALL_JOB=creed-copy); a person can also run it by hand from the web on main. It never
# runs on a branch. GitLab starts no pipeline for a job-token push, so this job runs the
# gate itself before it pushes. A red run pushes nothing and leaves main untouched; next
# week's run tries again. The steps live in tools/creed-copy-refresh.sh.
creed-copy-refresh:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $ROLLCALL_JOB == "creed-copy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - sh tools/creed-copy-refresh.sh
